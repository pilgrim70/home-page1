<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 2 430 96" width="100%" height="100%">
  <!-- Symbol: Open doors and White Cross (Vertically stretched by 10%) -->
  <g id="logo-symbol">
    <!-- Left Blue Door -->
    <path d="M 12 4 L 48 15 L 48 85 L 12 96 Z" fill="#008dd5" />
    <!-- Right Green Door -->
    <path d="M 52 16 L 88 25 L 88 95 L 52 86 Z" fill="#83c024" />
    <!-- White Cross (Overlaying Negative Space) -->
    <!-- Vertical member -->
    <rect x="44" y="23" width="12" height="64" fill="#ffffff" />
    <!-- Horizontal member -->
    <rect x="34" y="46" width="32" height="12" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <g id="logo-text" font-family="'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
    <!-- "복의근원" in teal/mint -->
    <text x="105" y="32" fill="#00a28f" font-size="16" font-weight="700" letter-spacing="-0.5px">복의근원</text>
    
    <!-- "관유중앙교회" (Red + Black) -->
    <text x="180" y="54" fill="#c02b11" font-size="34" font-weight="800" letter-spacing="-1px">관유중앙</text>
    <text x="305" y="54" fill="#111111" font-size="34" font-weight="800" letter-spacing="-1px">교회</text>
    
    <!-- "대한예수교장로회" in grey with wide letter spacing -->
    <text x="260" y="86" fill="#666666" font-size="15" font-weight="500" letter-spacing="3.5px">대한예수교장로회</text>
  </g>
</svg>
